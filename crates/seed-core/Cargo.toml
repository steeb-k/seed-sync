[package]
name = "seed-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SEED Sync sync engine: iroh transport + crypto + filesystem mirroring"

[dependencies]
# iroh stack
iroh.workspace = true
iroh-blobs.workspace = true
iroh-docs.workspace = true
iroh-gossip.workspace = true
iroh-tickets.workspace = true
bao-tree.workspace = true

# async / util
tokio.workspace = true
futures-lite.workspace = true
bytes.workspace = true

# serialization / encoding
serde.workspace = true
serde_bytes.workspace = true
ciborium.workspace = true
bech32.workspace = true
data-encoding.workspace = true

# crypto / hashing
ed25519-dalek.workspace = true
blake3.workspace = true
rand.workspace = true

# storage / fs
rusqlite.workspace = true
notify.workspace = true
walkdir.workspace = true
globset.workspace = true
directories.workspace = true
hostname.workspace = true

# diagnostics
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true

# shared IPC role/status types reused in summaries
seed-ipc = { path = "../seed-ipc" }

# OS keystore for share master seeds. No backend exists on Android, where it is
# compiled out (secrets.rs) in favour of the DB fallback, so it is target-gated
# off rather than pulled into the android build.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring.workspace = true

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
