[package]
name = "seed-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SEED Sync GTK4/Libadwaita GUI + system tray (IPC client to seed-daemon)"

[[bin]]
name = "seed-gui"
path = "src/main.rs"

# Embeds the Windows app icon (icon/appIconHiVis.ico) into the exe — see build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
seed-ipc = { path = "../seed-ipc", features = ["transport"] }
gtk.workspace = true
adw.workspace = true
glib.workspace = true
tokio.workspace = true
futures-lite.workspace = true
async-channel.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

# Tray is wired on Windows/macOS (the primary targets for it). On Linux the
# tray-icon backend pulls GTK3/appindicator which clashes with our GTK4 app, so
# the Linux tray is a no-op for now (tracked for a later ksni-based pass).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.5"

# macOS only: observe NSApplication "did become active" so a Dock/Finder reopen of
# the running app re-presents the (tray-hidden) window — GTK4 doesn't surface the
# macOS reopen as a GApplication signal. objc2 is already in the tree via tray-icon.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSOperation", "NSString", "NSObject", "NSThread", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
block2 = "0.6"
