[package]
name = "seed-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SEED Sync background sync daemon (console in dev, Windows service in production)"

[[bin]]
name = "seed-daemon"
path = "src/main.rs"

[dependencies]
seed-core = { path = "../seed-core" }
seed-ipc = { path = "../seed-ipc", features = ["transport"] }
tokio.workspace = true
tokio-util.workspace = true
interprocess.workspace = true
futures-lite.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
directories.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true

# logind PrepareForSleep listener for suspend/resume self-heal (Linux only).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
seed-harness = { path = "../seed-harness" }
walkdir.workspace = true
