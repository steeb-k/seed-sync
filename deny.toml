# cargo-deny configuration — supply-chain checks for CI.
#
# Run locally with:  cargo deny check
# Docs:              https://embarkstudios.github.io/cargo-deny/

[graph]
# No `targets` filter, so dependencies for every platform are checked. An
# advisory affecting a target we build only occasionally still fails CI.
#
# `all-features` is intentionally not set here: CI runs with `--all-features` so
# that optional dependencies are covered too. Local `cargo deny check` runs
# without it and will see a slightly smaller graph.

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Only flag unmaintained crates we depend on directly — the ones we can actually
# act on. Transitive unmaintained crates are upstream's call, and failing on them
# turns CI permanently red for something we cannot fix.
unmaintained = "workspace"
#
# THIS LIST IS NOT A COMPLETE INVENTORY OF KNOWN ADVISORIES. It only contains
# things that would otherwise FAIL the build. RustSec marks some advisories
# `informational = "unsound"` (or "notice"), and cargo-deny does not fail on
# those — so they never appear here even though they are real and open.
#
# Worked example, because the discrepancy is confusing if you meet it cold:
# GHSA-wrw7-89jp-8q8g / RUSTSEC-2024-0429 (unsoundness in glib's
# VariantStrIter iterators, fixed in 0.20.0) is open against glib 0.18.5 in
# Cargo.lock. Dependabot raises it; cargo-deny is silent because it is
# informational; and Dependabot cannot fix it because it is transitive, so its
# auto-update job just fails on repeat. It is dismissed on the Dependabot tab
# as not-used rather than suppressed here, because it is not suppressible here.
#
# Why it is genuinely not reachable: glib 0.18.5 enters only through
# tray-icon -> libappindicator/muda -> gtk 0.18 (GTK3), and that path does not
# occur on any target this workspace builds. `cargo tree -i glib@0.18.5` finds
# nothing on x86_64-pc-windows-msvc, x86_64-apple-darwin or
# x86_64-unknown-linux-gnu; it shows up only under `--target all`, as an
# artifact of union-of-all-platforms lockfile resolution.
#
# Open advisories as of 2026-07-26, suppressed so CI is green on merge.
# These are earmarked work, NOT accepted risk. Removing an entry from this
# list is how each one gets fixed — re-run `cargo deny check advisories`
# after any dependency bump to see if it can go.
ignore = [
    # FIXED and removed, not suppressed — cargo-deny passing without them is the
    # proof:
    #   RUSTSEC-2026-0190  anyhow 1.0.102 -> 1.0.104
    #   RUSTSEC-2026-0204  crossbeam-epoch 0.9.18 -> 0.9.20
    # quick-xml — NOT APPLICABLE rather than deferred:
    #
    #   0194  quadratic run time on duplicate attribute names
    #   0195  unbounded namespace-declaration allocation (memory DoS)
    #
    # `cargo tree -i quick-xml` shows exactly one consumer, and every path ends
    # at the same place:
    #
    #   quick-xml -> wayland-scanner (proc-macro)
    #
    # wayland-scanner is a build-time code generator: it parses the fixed
    # Wayland protocol XML that ships inside wayland-protocols and emits Rust.
    # quick-xml never links into a binary — `cargo tree -e normal` shows no
    # runtime path either.
    #
    # Both advisories are denial-of-service on parser *input*. The only input
    # here is trusted XML vendored in the dependency tree, parsed on the build
    # machine. Triggering either would require controlling that XML, which is
    # already arbitrary code execution via build.rs.
    #
    # No action needed and none possible: quick-xml >=0.41 is transitive, so it
    # clears itself whenever wayland-scanner bumps.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[bans]
# Duplicate versions are common in large trees and usually not our fault.
multiple-versions = "warn"
# A wildcard version means "whatever the registry serves today", which is how a
# substituted crate gets pulled in silently. Every wildcard in these workspaces
# is an internal `{ path = "../foo" }` dependency, which is harmless — but
# `allow-wildcard-paths` only exempts those on crates marked `publish = false`,
# and these crates are not. Warn rather than fail so the check stays useful
# without CI being permanently red. Mark the workspace crates `publish = false`
# and this can go back to "deny".
wildcards = "warn"
allow-wildcard-paths = true
deny = []

[sources]
# The anti-substitution control: every crate must come from crates.io. A
# dependency appearing from an unexpected registry or an arbitrary git URL fails
# CI instead of being vendored into the build silently.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
# Permissive licenses plus GPL-3.0 (these projects are GPL-3.0-or-later
# themselves). Anything outside this list is a deliberate decision, not a silent
# addition to the tree.
allow = [
    "GPL-3.0-or-later",
    # Deprecated SPDX id, still used by winfsp / winfsp-sys.
    "GPL-3.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    # Bundled fonts (epaint_default_fonts).
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
    "Ubuntu-font-1.0",
    # Mozilla CA root bundle (webpki-roots, webpki-root-certs) — data, not code.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# This config is shared across repos, so a license allowed here but unused in a
# given tree is expected and should not be reported.
unused-allowed-license = "allow"

[licenses.private]
ignore = true
