# SEED Sync .deb and .rpm, built by nfpm from the tree scripts/package-linux.sh
# stages. Run it through scripts/package-linux-native.sh from the repo root:
# that script copies the staged tree to dist/native/tree (nfpm expands no
# variables in content paths, so the path is fixed), writes the /usr/bin
# variant of the unit and the desktop file, generates a metainfo <releases>
# block, and exports SEED_VERSION for the version field.
#
# Differences from the tarball install, on purpose (docs/linux-packaging.md):
# binaries in /usr/bin rather than ~/.local/bin, the unit in
# /usr/lib/systemd/user (still a *per-user* service — SEED Sync has no root
# daemon), and no self-update timer/service — the package manager owns
# upgrades, and `seed-sync --update` refuses once it sees a package-managed
# /usr/bin/seed-daemon.
name: seed-sync
arch: amd64
platform: linux
version: ${SEED_VERSION}
version_schema: semver
release: "1"
section: net
priority: optional
maintainer: steeb-k <skaznak@protonmail.com>
vendor: steeb-k
homepage: https://github.com/steeb-k/seed-sync
license: GPL-3.0-or-later
description: |-
  Peer-to-peer mirrored folder sync
  S.E.E.D. (SEED Sync) keeps folders mirrored across your machines over a
  direct, end-to-end encrypted peer-to-peer connection (built on iroh). A
  master key holder signs a versioned manifest; viewer key holders verify and
  mirror it exactly. Includes the daemon (a per-user systemd --user service),
  the GTK4/Libadwaita desktop app with its tray presence indicator, and
  seed-cli.

# The GUI needs glibc 2.39 (the ubuntu-24.04 build image binds to it); the
# daemon links libdbus directly (keyring's Secret Service).
overrides:
  deb:
    depends:
      - libc6 (>= 2.39)
      - libgcc-s1
      - libgtk-4-1 (>= 4.10)
      - libadwaita-1-0 (>= 1.4)
      - libdbus-1-3
  rpm:
    # Sonames rather than package names: Fedora calls these gtk4/libadwaita/
    # dbus-libs, openSUSE libgtk-4-1/libadwaita-1-0/libdbus-1-3.
    depends:
      - libc.so.6(GLIBC_2.39)(64bit)
      - libgcc_s.so.1()(64bit)
      - libgtk-4.so.1()(64bit)
      - libadwaita-1.so.0()(64bit)
      - libdbus-1.so.3()(64bit)

rpm:
  summary: Peer-to-peer mirrored folder sync
  group: Applications/Internet
  compression: zstd

deb:
  # xz, not zstd: every dpkg reads it, and lintian rejects a data.tar.zst.
  compression: xz

contents:
  - src: dist/native/tree/bin/seed-daemon
    dst: /usr/bin/seed-daemon
    file_info: {mode: 0755}
  - src: dist/native/tree/bin/seed-gui
    dst: /usr/bin/seed-gui
    file_info: {mode: 0755}
  - src: dist/native/tree/bin/seed-cli
    dst: /usr/bin/seed-cli
    file_info: {mode: 0755}
  # Shipped for --status; it refuses to install, update or uninstall a
  # package-managed copy (refuse_if_pkg_managed).
  - src: dist/native/tree/seed-sync
    dst: /usr/bin/seed-sync
    file_info: {mode: 0755}

  - src: dist/native/seed-daemon.service
    dst: /usr/lib/systemd/user/seed-daemon.service
    file_info: {mode: 0644}

  # The apps.kznjk.com repository, so a .deb or .rpm installed from a downloaded
  # file keeps updating (packaging/linux/repo/README.md). dpkg handles the
  # config files; the .rpm copies its definitions in postinstall, because dnf and
  # zypper read different directories and only one exists on a given system.
  - src: packaging/linux/repo/kznjk.sources
    dst: /etc/apt/sources.list.d/kznjk.sources
    type: config|noreplace
    packager: deb
    file_info: {mode: 0644}
  - src: packaging/linux/repo/kznjk-packages.asc
    dst: /etc/apt/keyrings/kznjk-packages.asc
    type: config|noreplace
    packager: deb
    file_info: {mode: 0644}
  - src: packaging/linux/repo/kznjk.repo
    dst: /usr/share/seed-sync/repo/kznjk.repo
    packager: rpm
    file_info: {mode: 0644}
  - src: packaging/linux/repo/kznjk-zypper.repo
    dst: /usr/share/seed-sync/repo/kznjk-zypper.repo
    packager: rpm
    file_info: {mode: 0644}

  - src: dist/native/tree/share/applications/io.github.steeb_k.SeedSync.desktop
    dst: /usr/share/applications/io.github.steeb_k.SeedSync.desktop
    file_info: {mode: 0644}
  - src: dist/native/metainfo/io.github.steeb_k.SeedSync.metainfo.xml
    dst: /usr/share/metainfo/io.github.steeb_k.SeedSync.metainfo.xml
    file_info: {mode: 0644}
  - src: dist/native/tree/share/icons/hicolor/16x16/apps/io.github.steeb_k.SeedSync.png
    dst: /usr/share/icons/hicolor/16x16/apps/io.github.steeb_k.SeedSync.png
    file_info: {mode: 0644}
  - src: dist/native/tree/share/icons/hicolor/22x22/apps/io.github.steeb_k.SeedSync.png
    dst: /usr/share/icons/hicolor/22x22/apps/io.github.steeb_k.SeedSync.png
    file_info: {mode: 0644}
  - src: dist/native/tree/share/icons/hicolor/24x24/apps/io.github.steeb_k.SeedSync.png
    dst: /usr/share/icons/hicolor/24x24/apps/io.github.steeb_k.SeedSync.png
    file_info: {mode: 0644}
  - src: dist/native/tree/share/icons/hicolor/32x32/apps/io.github.steeb_k.SeedSync.png
    dst: /usr/share/icons/hicolor/32x32/apps/io.github.steeb_k.SeedSync.png
    file_info: {mode: 0644}
  - src: dist/native/tree/share/icons/hicolor/48x48/apps/io.github.steeb_k.SeedSync.png
    dst: /usr/share/icons/hicolor/48x48/apps/io.github.steeb_k.SeedSync.png
    file_info: {mode: 0644}
  - src: dist/native/tree/share/icons/hicolor/64x64/apps/io.github.steeb_k.SeedSync.png
    dst: /usr/share/icons/hicolor/64x64/apps/io.github.steeb_k.SeedSync.png
    file_info: {mode: 0644}
  - src: dist/native/tree/share/icons/hicolor/128x128/apps/io.github.steeb_k.SeedSync.png
    dst: /usr/share/icons/hicolor/128x128/apps/io.github.steeb_k.SeedSync.png
    file_info: {mode: 0644}
  - src: dist/native/tree/share/icons/hicolor/256x256/apps/io.github.steeb_k.SeedSync.png
    dst: /usr/share/icons/hicolor/256x256/apps/io.github.steeb_k.SeedSync.png
    file_info: {mode: 0644}
  - src: dist/native/tree/share/icons/hicolor/512x512/apps/io.github.steeb_k.SeedSync.png
    dst: /usr/share/icons/hicolor/512x512/apps/io.github.steeb_k.SeedSync.png
    file_info: {mode: 0644}

  # Each format's own place for the license.
  - src: packaging/linux/copyright
    dst: /usr/share/doc/seed-sync/copyright
    packager: deb
    file_info: {mode: 0644}
  - src: dist/native/tree/LICENSE
    dst: /usr/share/licenses/seed-sync/LICENSE
    packager: rpm
    file_info: {mode: 0644}

scripts:
  preinstall: packaging/linux/scripts/preinstall.sh
  postinstall: packaging/linux/scripts/postinstall.sh
  preremove: packaging/linux/scripts/preremove.sh
  # No postremove: seed-daemon.service lives under /usr/lib/systemd/user, which
  # the *system* manager never loads, so there is no system-level daemon-reload
  # to run (each user's own `systemctl --user daemon-reload`, or their next
  # login, picks up the removal). lintian flags an empty postrm.
