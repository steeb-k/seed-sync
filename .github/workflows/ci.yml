name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run's verdict irrelevant, and
# these builds are not cheap (the iroh stack dominates the compile time).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test (ubuntu)
    runs-on: ubuntu-latest
    # The vendored iroh forks are built from source alongside the workspace, so
    # a cold build is substantially longer than the dependency count suggests.
    timeout-minutes: 60
    steps:
      # Actions are pinned by commit SHA rather than tag, matching the
      # cargo-deny workflow: a tag can be moved to point at different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # All three are *link-time* requirements of seed-gui; nothing here needs a
      # display server, so there is no xvfb.
      #
      # - libgtk-4-dev / libadwaita-1-dev: the GUI itself. Ubuntu 24.04 ships
      #   GTK 4.14, which satisfies the gtk4 crate's "v4_10" feature.
      # - libdbus-1-dev: the Linux tray is ksni (StatusNotifier), and ksni 0.3
      #   reaches libdbus-sys via the `dbus` crate rather than a pure-Rust zbus,
      #   so it needs the C library's pkg-config file to build.
      #
      # rusqlite is "bundled", so SQLite compiles from source and no
      # libsqlite3-dev is required.
      - name: Install GTK4, libadwaita and D-Bus headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libdbus-1-dev

      # Uses the toolchain preinstalled on the runner rather than a
      # setup-toolchain action: one less third-party action in the supply chain
      # for a workflow whose whole point is to be trustworthy. The workspace
      # sets rust-version = 1.85, far below what the image ships.
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Split from the test step so a compile failure is distinguishable from a
      # test failure at a glance. --locked makes a stale Cargo.lock a CI failure
      # instead of a silent re-resolve, which is the same supply-chain property
      # cargo-deny is there to protect.
      - name: Build
        run: cargo build --workspace --locked --all-targets

      # Plain `cargo test` deliberately: the tests that need real network peers
      # or an elevated shell are already #[ignore]d in-tree and stay skipped
      # here. Running them would need infrastructure this job does not have.
      #
      # This covers the workspace only. The vendored iroh/iroh-blobs/iroh-docs
      # forks under vendor/ come in through [patch.crates-io] as path deps, not
      # as workspace members, so their own upstream suites are compiled but not
      # run — which is the intent; they are upstream's tests, not this repo's.
      - name: Test
        run: cargo test --workspace --locked
