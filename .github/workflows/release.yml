name: Release

# Cuts a Linux release: builds the tarball and publishes it to the PUBLIC
# artifact repo (steeb-k/seed-sync-binaries) as a GitHub Release for the tag.
# The Windows side attaches its artifact to the SAME release (see
# docs/cross-os-testing.md). Trigger by pushing a version tag:
#
#     git tag v0.1.1 && git push origin v0.1.1
#
# REQUIRED SECRET: SEED_BINARIES_TOKEN — a PAT (or fine-grained token) with
# `contents: write` on steeb-k/seed-sync-binaries. The default GITHUB_TOKEN
# cannot write to another repository.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux tarball -> seed-sync-binaries
    # ubuntu-24.04: the GUI needs GTK 4.10+ (the gtk4 `v4_10` feature), and 22.04
    # only ships GTK 4.6 — too old to build. 24.04 has GTK 4.14. The resulting
    # glibc floor (2.39) is moot since targets need GTK 4.10+ at runtime anyway.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 + Libadwaita + D-Bus + ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev imagemagick
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the release tarball
        run: scripts/package-linux.sh
      - name: Sanity-check the tag matches Cargo.toml
        run: |
          CARGO_VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VER" != "$TAG_VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VER"
            exit 1
          fi
      - name: Publish to seed-sync-binaries
        uses: softprops/action-gh-release@v2
        with:
          repository: steeb-k/seed-sync-binaries
          token: ${{ secrets.SEED_BINARIES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*.tar.gz
          # Don't clobber a Windows asset already attached to this release.
          fail_on_unmatched_files: true

  macos:
    name: macOS universal tarball -> seed-sync-binaries
    # macos-14 is the Apple Silicon (arm64) runner. We ship a UNIVERSAL2 asset
    # (seed-sync-<ver>-macos-universal.tar.gz): the preinstalled arm64 Homebrew
    # (/opt/homebrew) supplies the arm64 GTK closure, and a SECOND x86_64 Homebrew
    # at /usr/local (under Rosetta) supplies the x86_64 closure — package-macos.sh
    # builds both Rust slices and lipo's every Mach-O. Both brews install the same
    # GTK version (latest bottle) so the dylib sets match. Xcode CLT
    # (install_name_tool/codesign/otool/lipo/iconutil) is preinstalled; the bundler
    # ad-hoc signs the relocated dylibs. NOTE: the second-Homebrew + Rosetta setup
    # is the heaviest/most novel part — validate it on the first macOS release tag.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Sanity-check the tag matches Cargo.toml
        run: |
          CARGO_VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VER" != "$TAG_VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VER"
            exit 1
          fi
      - name: Install arm64 GTK4 + libadwaita
        run: brew install gtk4 libadwaita pkg-config
      - name: Ensure Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license || true
      - name: Install x86_64 Homebrew + GTK4 (for the universal x86_64 slice)
        run: |
          # A second, x86_64 Homebrew at /usr/local under Rosetta. The runner has
          # passwordless sudo, so the bootstrap runs non-interactively.
          NONINTERACTIVE=1 arch -x86_64 /bin/bash -c \
            "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          arch -x86_64 /usr/local/bin/brew install gtk4 libadwaita pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build the universal tarball (bundle + relocate + lipo + ad-hoc sign)
        run: scripts/package-macos.sh
      - name: Publish to seed-sync-binaries
        uses: softprops/action-gh-release@v2
        with:
          repository: steeb-k/seed-sync-binaries
          token: ${{ secrets.SEED_BINARIES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*.tar.gz
          # Attaches alongside the Linux/Windows assets on the same release.
          fail_on_unmatched_files: true

  windows:
    name: Windows MSI -> seed-sync-binaries
    # Builds the signed MSI end to end and publishes it to the same release as
    # Linux/macOS. GTK comes from gvsbuild (Option A: built once, then cached).
    # Signing uses Azure Trusted Signing via OIDC — the cert never touches CI; the
    # runner authenticates as a service principal and the dlib signs remotely.
    #
    # REQUIRED SETUP before this job can sign (one-time, by the maintainer):
    #   1. artifact-signing-metadata.json at the repo root (committed) — DONE.
    #   2. An Azure AD app (service principal) with the "Trusted Signing Certificate
    #      Profile Signer" role on the Trusted Signing account, and an OIDC federated
    #      credential for this repo (subject e.g. repo:steeb-k/seed-sync-gtk:ref:refs/tags/v*).
    #   3. Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
    # Until those exist, azure/login fails and the job errors — but it's independent,
    # so the Linux + macOS assets still publish. (UNVALIDATED on a runner — the
    # gvsbuild + dlib-install steps want a first-tag shakeout on Windows.)
    runs-on: windows-latest
    permissions:
      id-token: write     # azure/login OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Sanity-check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "$env:GITHUB_REF_NAME".TrimStart('v')
          if ($ver -ne $tag) { Write-Error "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $ver"; exit 1 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-msvc
      - uses: Swatinem/rust-cache@v2

      # --- GTK via gvsbuild, cached (Option A). First run ~30-60 min; later runs
      # restore C:\gtk from cache. Bump the key suffix to force a rebuild. ---
      - name: Cache GTK (C:\gtk)
        id: gtk
        uses: actions/cache@v4
        with:
          path: C:\gtk
          key: gtk-gvsbuild-gtk4-libadwaita-v1
      - name: Build GTK with gvsbuild
        if: steps.gtk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          py -m pip install --user pipx
          py -m pipx ensurepath
          pipx install gvsbuild
          gvsbuild build gtk4 libadwaita

      - name: Install WiX 5
        shell: pwsh
        run: dotnet tool install --global wix --version "5.*"

      # --- Azure auth for Trusted Signing (OIDC; no stored cert/secret) ---
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install Trusted Signing client (Azure.CodeSigning.Dlib)
        shell: pwsh
        run: |
          # sign-artifacts.ps1 signs via `signtool /dlib Azure.CodeSigning.Dlib.dll`.
          # The dlib ships in the Microsoft.Trusted.Signing.Client NuGet; install it
          # and point ARTIFACT_SIGNING_DLIB at the dll so the script finds it.
          $dir = "$env:RUNNER_TEMP\tsclient"
          nuget install Microsoft.Trusted.Signing.Client -OutputDirectory $dir -ExcludeVersion
          $dll = Get-ChildItem $dir -Recurse -Filter Azure.CodeSigning.Dlib.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "Azure.CodeSigning.Dlib.dll not found in the NuGet"; exit 1 }
          "ARTIFACT_SIGNING_DLIB=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # --- Build + bundle + sign exes + wix + sign MSI (reuses the local script;
      # it reads artifact-signing-metadata.json and signs via the OIDC session). ---
      - name: Build + sign the MSI
        shell: pwsh
        run: pwsh -File scripts\build-msi.ps1

      - name: Publish MSI to seed-sync-binaries
        uses: softprops/action-gh-release@v2
        with:
          repository: steeb-k/seed-sync-binaries
          token: ${{ secrets.SEED_BINARIES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: target/wix/*.msi
          fail_on_unmatched_files: true
