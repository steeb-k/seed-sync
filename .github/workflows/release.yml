# A tag becomes a release.
#
# Pushing `v<version>` builds every platform (build.yml), gates on the same
# checks ci.yml runs, and publishes ONE GitHub release — on the PUBLIC
# `steeb-k/seed-sync-binaries` repo, not this one; every installed updater
# reads that repo's `releases/latest` — with all nine assets attached in a
# single call. Never create-then-upload, because the moment a release is
# Latest, updaters act on it, and a release missing an asset strands that
# platform (the Windows updater will not cross architectures).
#
# Rehearsals: a `v<version>-test<N>` tag publishes a PRERELEASE, which every
# updater ignores. `workflow_dispatch` with publish=false builds the
# artifacts and publishes nothing. docs/releasing.md and docs/ci-release.md
# have the checklist.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag to build and publish (leave empty to build the current ref without publishing).'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publish the GitHub release. Off builds artifacts only.'
        required: false
        default: true
        type: boolean
      sign:
        description: 'Sign the artifacts. Off only for a rehearsal on a fork or before the secrets exist.'
        required: false
        default: true
        type: boolean
      platforms:
        description: 'Which platforms to build: all, or a space-separated subset of linux arch windows macos android. Anything but all disables publishing.'
        required: false
        default: all
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: build + test + cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install GTK4, libadwaita and D-Bus headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo build --workspace --locked --all-targets
      - run: cargo test --workspace --locked
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: ./Cargo.toml

  build:
    uses: ./.github/workflows/build.yml
    with:
      sign: ${{ github.event_name == 'push' || inputs.sign }}
      platforms: ${{ inputs.platforms || 'all' }}
      # The tag's source even when dispatched from a branch: the workflow
      # comes from wherever it was dispatched (so it carries a CI fix), the
      # code built is exactly what the tag points at.
      ref: ${{ inputs.tag || github.ref }}
    secrets: inherit

  publish:
    name: Publish the release
    if: github.event_name == 'push' || (inputs.publish && inputs.tag != '' && (inputs.platforms == 'all' || inputs.platforms == ''))
    needs: [gate, build]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Version gate
        id: release
        # The tag is the authority. If it disagrees with Cargo.toml, or
        # Android was not bumped (the literals in build.gradle.kts, the step
        # everyone forgets), publishing would put a version behind a tag
        # nobody expects or ship an APK that silently cannot update in
        # place. See docs/ci-release.md §4.
        run: scripts/ci/version-gate.sh "${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Collect exactly the nine assets
        run: scripts/ci/collect-assets.sh "${{ steps.release.outputs.version }}" artifacts dist

      - name: Release notes from the changelog
        # The `## [<version>]` section of CHANGELOG.md; a dashed (rehearsal)
        # tag with no exact section falls back to `## [Unreleased]`. Matched
        # with index()/substr() rather than a bracket-containing dynamic
        # regexp — awk's own string-escaping of a `-v` value un-escapes
        # `\[`/`\]` before it ever reaches the regex engine, turning
        # "^## \[0.8.0\]" into the bracket EXPRESSION "^## [0.8.0]" (matches
        # one char from the set {0,.,8}) instead of literal brackets, so the
        # section is silently never found.
        run: |
          v="${{ steps.release.outputs.version }}"
          awk -v h="## [$v]" '
            index($0, h) == 1 {on=1; next}
            on && substr($0,1,4) == "## [" {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            awk -v h="## [Unreleased]" '
              index($0, h) == 1 {on=1; next}
              on && substr($0,1,4) == "## [" {exit}
              on {print}
            ' CHANGELOG.md > notes.md
          fi
          if [ ! -s notes.md ]; then echo "SEED Sync $v." > notes.md; fi
          cat notes.md

      - name: Create the release
        # The binaries repo has no source, so the tag is created there by
        # `gh` as a lightweight tag on its default branch — do NOT pass
        # --verify-tag, which requires a tag object already on the target
        # repo.
        env:
          GH_TOKEN: ${{ secrets.SEED_BINARIES_TOKEN }}
        run: |
          flags=(--title "v${{ steps.release.outputs.version }}" --notes-file notes.md)
          if [ "${{ steps.release.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "${{ steps.release.outputs.tag }}" -R steeb-k/seed-sync-binaries "${flags[@]}" dist/*
