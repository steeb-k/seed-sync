[workspace]
resolver = "2"
members = [
    "crates/seed-ipc",
    "crates/seed-core",
    "crates/seed-mobile",
    "crates/seed-daemon",
    "crates/seed-gui",
    "crates/seed-cli",
]

[workspace.package]
version = "1.2.2"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/steeb-k/seed-sync-gtk"
rust-version = "1.85"

# Shared dependency versions. The iroh ecosystem crates must be bumped TOGETHER:
# they share `iroh-base`, and mixing minors fails to compile. After any bump run
# `cargo tree -d` and confirm a single `iroh-base` resolves.
[workspace.dependencies]
# --- iroh P2P stack (pin together; all resolve to iroh-base 1.0) ---
iroh = "1.0"
iroh-blobs = "0.103"
iroh-gossip = "0.101"
iroh-docs = "0.101"
iroh-tickets = "1.0"
# bao-tree must match the version iroh-blobs pulls in (used for streamed blob repair).
bao-tree = "0.16"

# --- async runtime / utils ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-lite = "2"
async-channel = "2"
bytes = "1"

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"          # CBOR (serde)
data-encoding = "2"       # base32 for key strings
bech32 = "0.12"

# --- crypto / hashing ---
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake3 = "1"
rand = "0.8"

# --- storage / fs ---
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8"
walkdir = "2"
globset = "0.4"
directories = "5"
hostname = "0.4"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# --- gui (binding versions track installed GTK 4.22 / libadwaita 1.9) ---
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
glib = "0.22"

# --- platform / ipc ---
interprocess = { version = "2", features = ["tokio"] }
tray-icon = "0.24"
windows-service = "0.8"

# --- diagnostics / cli ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Vendored, one-line-patched iroh-blobs (see vendor/iroh-blobs, docs/cross-os-testing.md #1):
# upstream's `ExportMode::TryReference` only treated EXDEV (unix, 18) as a cross-volume
# move, so on Windows (ERROR_NOT_SAME_DEVICE, 17) a viewer whose mirror is on a different
# drive than its data dir failed the reference export and kept a second full copy. The
# patch adds the Windows code so the export falls back to copy + sets External there too.
[patch.crates-io]
iroh-blobs = { path = "vendor/iroh-blobs" }
